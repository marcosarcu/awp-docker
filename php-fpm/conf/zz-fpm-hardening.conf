; Hardening anti-webshell, SOLO para el pool de PHP-FPM.
; Este fragmento se anade al final de /usr/local/etc/php-fpm.d/www.conf (dentro de
; la seccion [www]) desde el Dockerfile. Se usa php_admin_value y no php.ini porque
; conf.d tambien lo lee php-cli: WP-CLI y los crons (php-cli) siguen funcionando.
; No se usa open_basedir.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,show_source
