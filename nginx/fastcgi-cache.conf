# FastCGI page cache - http context (cargado desde conf.d)

fastcgi_cache_path /var/cache/nginx/wordpress
    levels=1:2
    keys_zone=WORDPRESS:100m
    max_size=512m
    inactive=60m
    use_temp_path=off;

# ---- Query strings ----
# Por defecto cualquier query string salta el cache (ver $skip_cache en default.conf).
# Excepcion: parametros que NO cambian el HTML que genera PHP (tracking de campañas
# y flags que solo lee el JS del navegador). Esos no saltan el cache y ademas se
# quitan de la clave, asi /?utm_source=x y /?fbclid=y comparten la entrada de /.
#
# $skip_args = 0 si no hay query o si TODOS los parametros estan en la lista;
#              1 si hay alguno fuera de la lista (p.ej. ?s=, ?add-to-cart=).
# Un parametro desconocido mezclado con utm_* sigue saltando el cache.
#
# Mantener alineada con el filtro `awp_cache_ignored_query_params` del plugin
# AWP Cache Helper: PHP tiene que emitir Cache-Control para exactamente los
# mismos parametros, o nginx (opt-in, valid=0s) no guarda nada.
map $args $skip_args {
    default 1;
    ""      0;
    "~*^(?:(?:utm_[a-z0-9_]+|fbclid|gclid|gbraid|wbraid|msclkid|ttclid|carrito)(?:=[^&]*)?)(?:&(?:utm_[a-z0-9_]+|fbclid|gclid|gbraid|wbraid|msclkid|ttclid|carrito)(?:=[^&]*)?)*&?$" 0;
}

# Ruta cruda (sin decodificar, sin query) para la clave de cache.
# Se usa $request_uri y no $uri para que la clave coincida con lo que manda el
# endpoint /purge (que tambien trabaja sobre la ruta cruda, con acentos
# percent-encoded). Como todo lo que no sea tracking salta el cache, la unica
# variante con query que llega a guardarse es la de tracking, y queremos que
# colapse en la entrada de la ruta limpia.
map $request_uri $cache_uri {
    "~^(?<cache_path>[^?]*)" $cache_path;
}

fastcgi_cache_key "$scheme$request_method$host$cache_uri";

# Evita stampede cuando varios clientes piden la misma URL miss
fastcgi_cache_lock         on;
fastcgi_cache_lock_timeout 5s;

# Sirve stale si el backend falla / se actualiza
fastcgi_cache_use_stale       error timeout invalid_header updating http_500 http_503;
fastcgi_cache_background_update on;

# Solo cacheamos GET/HEAD
fastcgi_cache_methods GET HEAD;

# IMPORTANTE: opt-in puro.
# Sin fastcgi_ignore_headers, nginx respeta Cache-Control / Expires / Set-Cookie de WP.
# valid=0s en 200/301/302 -> si la respuesta no trae Cache-Control con max-age,
# NO se cachea. Si WP manda "Cache-Control: max-age=N", se cachea N segundos.
fastcgi_cache_valid 200 301 302 0s;
fastcgi_cache_valid 404 1m;
