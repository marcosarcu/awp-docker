# Gestionado por el plan de seguridad de dependencias.
# - Librerías (composer/npm/uv/pip): open-pull-requests-limit 0 = sin updates de versión; Dependabot
#   solo abre PRs cuando una versión nueva arregla una vulnerabilidad (security updates).
# - Imágenes Docker, compose y GitHub Actions: updates de versión diarios, agrupados en un PR.
#   Imágenes: solo minor y patch; los saltos major (Postgres, MariaDB, Redis, Node) se planifican aparte.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
    time: '06:00'
    timezone: America/Argentina/Buenos_Aires
  groups:
    actions:
      patterns:
      - '*'
- package-ecosystem: docker
  directory: /nginx
  schedule:
    interval: daily
    time: '06:00'
    timezone: America/Argentina/Buenos_Aires
  groups:
    docker:
      patterns:
      - '*'
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
  - dependency-name: php
    update-types:
    - version-update:semver-minor
- package-ecosystem: docker
  directory: /php-fpm
  schedule:
    interval: daily
    time: '06:00'
    timezone: America/Argentina/Buenos_Aires
  groups:
    docker:
      patterns:
      - '*'
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
  - dependency-name: php
    update-types:
    - version-update:semver-minor
