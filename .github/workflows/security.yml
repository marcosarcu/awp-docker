# Auditoría de dependencias e imágenes. Falla si hay vulnerabilidades HIGH o CRITICAL.
# - composer audit / npm audit / pip-audit: librerías contra las bases públicas de advisories.
# - Trivy: la imagen Docker ya armada (SO base, binarios y librerías).
# Las vulnerabilidades publicadas después del deploy las cubre el reescaneo diario en los hosts
# (host-vulncheck images).
name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trivy:
    name: Trivy (${{ matrix.image.dockerfile }})
    # Con la variable del repo RUNNER (JSON) corre en los runners self-hosted; si no, en GitHub.
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    strategy:
      fail-fast: false
      matrix:
        image: [{"name": "nginx-dockerfile", "dockerfile": "nginx/Dockerfile", "context": "nginx"}, {"name": "php-fpm-dockerfile", "dockerfile": "php-fpm/Dockerfile", "context": "php-fpm"}]
    steps:
      - uses: actions/checkout@v7
      - name: Build de la imagen
        run: docker build -t "security-scan/${{ matrix.image.name }}:${{ github.sha }}" -f "${{ matrix.image.dockerfile }}" "${{ matrix.image.context }}"
      # Los headers del kernel (linux-libc-dev / linux-headers) vienen en la imagen pero no se
      # usan: el contenedor corre sobre el kernel del host, que se parchea aparte
      # (unattended-upgrades + host-vulncheck). Sus CVE se ignoran; el resto no.
      - name: Política de Trivy
        run: |
          cat > "$RUNNER_TEMP/trivy-ignore.rego" <<'REGO'
          package trivy

          import rego.v1

          default ignore := false

          ignore if input.PkgName in {"linux-libc-dev", "linux-headers"}
          REGO
      - name: Escanear con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IGNORE_POLICY: ${{ runner.temp }}/trivy-ignore.rego
        with:
          image-ref: security-scan/${{ matrix.image.name }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
