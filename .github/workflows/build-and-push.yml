name: build-and-push

on:
  push:
    branches: [main]
    paths:
      - 'nginx/**'
      - 'php-fpm/**'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      nginx: ${{ steps.filter.outputs.nginx }}
      php-fpm: ${{ steps.filter.outputs.php-fpm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            nginx:
              - 'nginx/**'
            php-fpm:
              - 'php-fpm/**'

  build:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: awp-nginx
            context: ./nginx
            changed: ${{ needs.changes.outputs.nginx }}
          - name: awp-php-fpm
            context: ./php-fpm
            changed: ${{ needs.changes.outputs.php-fpm }}
    steps:
      - name: Decide if build is needed
        id: decide
        run: |
          if [ "${{ matrix.changed }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No changes in ${{ matrix.name }}, skipping."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.decide.outputs.run == 'true'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: steps.decide.outputs.run == 'true'

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: steps.decide.outputs.run == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short sha
        if: steps.decide.outputs.run == 'true'
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        if: steps.decide.outputs.run == 'true'
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/marcosarcu/${{ matrix.name }}:latest
            ghcr.io/marcosarcu/${{ matrix.name }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/marcosarcu/awp-docker
            org.opencontainers.image.revision=${{ github.sha }}
